      <stop offset="0" stop-color="#7a5200"/><stop offset=".16" stop-color="#d4a017"/><stop offset=".36" stop-color="#fff4c4"/>
      <stop offset=".48" stop-color="#ffd700"/><stop offset=".63" stop-color="#b8860b"/><stop offset=".79" stop-color="#ffe57a"/><stop offset="1" stop-color="#8a6200"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#tile)"/>
       <rect x="14" y="14" width="484" height="484" rx="110" fill="none" stroke="#fff4c4" stroke-opacity=".55" stroke-width="4"/>
  <g transform="translate(0 0) scale(1)" fill="none" stroke="#0a1128" stroke-linecap="round" stroke-linejoin="round">
